name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The code checks run as parallel jobs, each failing on its own (HITLD-131). Each one decides in
  # its own steps whether it has anything to check (scripts/ci-changes.mjs): a pull request that
  # changes only work/ skips them, and the jobs still report success, so a required check never
  # waits on a job that did not run. A skip is decided from the paths in the diff alone, and when
  # the diff cannot be read the job fails.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base, which
          # scripts/ci-changes.mjs diffs against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: changes
        run: node scripts/ci-changes.mjs
      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      - run: npm run typecheck
        if: steps.changes.outputs.code == 'true'

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base, which
          # scripts/ci-changes.mjs diffs against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: changes
        run: node scripts/ci-changes.mjs
      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      - run: npm run format:check
        if: steps.changes.outputs.code == 'true'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base, which
          # scripts/ci-changes.mjs diffs against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: changes
        run: node scripts/ci-changes.mjs
      - run: npm ci
        if: steps.changes.outputs.code == 'true'
      # The age program, so the store's encryption interoperability tests run here rather than skip
      # (HITLD-185). From the runner's own package archive, which apt verifies.
      - name: Install age
        if: steps.changes.outputs.code == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version
      - run: npm test
        if: steps.changes.outputs.code == 'true'
        env:
          HITLD_TEST_SKIPS_FILE: ${{ runner.temp }}/skips.jsonl
      # Lists the skipped tests and why in the job summary, and fails on a skip that
      # core/test/expected-skips.json does not expect on this platform (HITLD-185).
      - name: Skipped tests
        if: ${{ (success() || failure()) && steps.changes.outputs.code == 'true' }}
        run: node scripts/test-skips.mjs "$RUNNER_TEMP/skips.jsonl"

  evals:
    # Fails when no baseline is committed in evals/baselines/ for these settings, or a scenario
    # that passed in it regresses. A scenario the baseline has not seen is only a note. The evals
    # need no packages, so there is no npm ci.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base, which
          # scripts/ci-changes.mjs diffs against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: changes
        run: node scripts/ci-changes.mjs
      - name: Offline evals
        run: node core/bin/hitld.mjs eval --offline --require-baseline
        if: steps.changes.outputs.code == 'true'

  # The reproducer's sandbox trusts Node 22.22.0 and later only (HITLD-30): its tests run on that
  # version too, where the permission-model fixes it needs first arrived. On Node 22.13 to 22.21
  # those tests skip and the sandbox refuses to run.
  reproduce-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out GitHub's merge commit; its first parent is the base, which
          # scripts/ci-changes.mjs diffs against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - id: changes
        run: node scripts/ci-changes.mjs
      - name: Reproducer tests
        run: node core/test/run.mjs core/test/reproduce.test.mjs
        if: steps.changes.outputs.code == 'true'

  # Two tracker items with one ID (two sessions each filed from their own copy of main) fail
  # here, naming both files (design part 3.4). On every pull request, a work/-only one too. Not on
  # main, where the check also wants the views current, which only a merge regenerates.
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tracker check
        if: github.event_name == 'pull_request'
        run: node core/bin/hitld.mjs work check

  # The name all of the code checks reported under before the split, which branch protection and
  # merge.pull_request.checks may name: it passes only when every job above succeeded (a job whose
  # steps were skipped for a work/-only pull request succeeded too), and fails otherwise.
  check:
    if: always()
    needs: [typecheck, format, tests, evals, tracker, reproduce-floor]
    runs-on: ubuntu-latest
    steps:
      - name: Every check job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e 'to_entries | all(.value.result == "success")' <<< "$RESULTS" > /dev/null

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Exempt: merge commits (main merged into a pull request branch, or a merge made by the
      # merge button). Every other commit is checked. Pull request: a person's commit carries
      # their own Signed-off-by; an agent commit (an Agent-Role or Dispatch trailer) is accepted
      # without one. Main: each pushed commit carries a person's Signed-off-by, which is the
      # approver's sign-off on the squash commit.
      - name: DCO check (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          node core/bin/dco-check.mjs --mode pr
          --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: DCO check (main)
        if: github.event_name == 'push'
        run: >-
          node core/bin/dco-check.mjs --mode main
          --from "$BEFORE_SHA" --to "$AFTER_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}

  # What CI can check of the private rules without the private term list (design part 10.3, rule
  # 7): no commit adds a policy.json that sets store.remote.url or a .human-in-the-lead/store-devices.json
  # (the commit guard refuses both at commit and at merge; this is the same rule), and no commit
  # adds an email address that is not a noreply one, in a file or its message. A finding names the
  # commit, the file and the line, never the address.
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Public check (pull request)
        if: github.event_name == 'pull_request'
        run: node core/bin/public-check.mjs --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Public check (main)
        if: github.event_name == 'push'
        run: node core/bin/public-check.mjs --from "$BEFORE_SHA" --to "$AFTER_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
