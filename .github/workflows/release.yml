name: Release

# Runs when the owner pushes a version tag. Making a release is the owner's decision (a one-way
# door for the public interface); this workflow only builds, attests and drafts it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node core/bin/hitld.mjs eval --offline
      - name: Package
        run: |
          mkdir dist
          npm pack --pack-destination dist
          tar -czf "dist/human-in-the-lead-plugin-${GITHUB_REF_NAME}.tgz" -C plugins human-in-the-lead
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
