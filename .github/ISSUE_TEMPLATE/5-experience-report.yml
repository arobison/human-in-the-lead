name: 'Experience report'
description: 'A longer account of using HITLd on real work.'
title: 'experience report: '
labels: [feedback, experience-report]
body:
  - type: markdown
    attributes:
      value: |
        Describe using HITLd on real work: what kind of work it was in general terms, how it went, what to keep and what to change.

        Everything you write here is public. Leave out the names of private projects, and their paths, data, people and plans.
  - type: input
    id: version
    attributes:
      label: HITLd version
      description: 'The plugin version or release tag, for example v0.1.0. `hitld --version` prints it.'
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: 'The agent harness HITLd ran in. If it is not listed, pick Other and name it under what happened.'
      options:
        - Claude Code
        - GitHub Copilot
        - Other
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Loop or area
      description: 'The loop, command or part of HITLd concerned.'
      placeholder: 'triage, the merge queue, hitld dispatch plan'
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: 'What happened'
      description: 'What you used HITLd for, in general terms, and how it went.'
    validations:
      required: true
  - type: textarea
    id: worked-well
    attributes:
      label: What worked well
      description: 'What you would keep.'
    validations:
      required: false
  - type: textarea
    id: got-in-the-way
    attributes:
      label: What got in the way
      description: 'What you would change.'
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 'What you expected'
      description: 'What you expected HITLd to do for you before you started.'
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 'Evidence'
      description: 'Counts from `hitld report` or `hitld ledger summary`, or other numbers, with anything private removed.'
    validations:
      required: false
  - type: checkboxes
    id: confidential
    attributes:
      label: No confidential material
      options:
        - label: 'This issue holds no confidential material from any project or person.'
          required: true
