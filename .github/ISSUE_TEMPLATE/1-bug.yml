name: 'Bug'
description: 'Something in HITLd is broken or gives a wrong result.'
title: 'bug: '
labels: [feedback, bug]
body:
  - type: markdown
    attributes:
      value: |
        Report something in HITLd that is broken or gives a wrong result.

        Everything you write here is public. Leave out the names of private projects, and their paths, data, people and plans.
  - type: input
    id: version
    attributes:
      label: HITLd version
      description: 'The plugin version or release tag, for example v0.1.0. `hitld --version` prints it.'
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: 'The agent harness HITLd ran in. If it is not listed, pick Other and name it under what happened.'
      options:
        - Claude Code
        - GitHub Copilot
        - Other
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Loop or area
      description: 'The loop, command or part of HITLd concerned.'
      placeholder: 'triage, the merge queue, hitld dispatch plan'
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: 'What happened'
      description: 'What you did and what HITLd did. Steps to reproduce help most.'
      placeholder: "1. Ran `hitld merge` with two branches queued.\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 'What you expected'
      description: 'What should have happened instead.'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 'Evidence'
      description: 'Command output, a report, error text or ledger entries, with anything private removed. Paste text rather than screenshots where you can.'
    validations:
      required: false
  - type: checkboxes
    id: confidential
    attributes:
      label: No confidential material
      options:
        - label: 'This issue holds no confidential material from any project or person.'
          required: true
