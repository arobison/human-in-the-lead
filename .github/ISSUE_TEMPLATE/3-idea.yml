name: 'Idea or design comment'
description: 'An idea for HITLd, or a comment on its design.'
title: 'idea: '
labels: [feedback, idea]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for HITLd or a comment on its design. You do not need a problem to file one.

        Everything you write here is public. Leave out the names of private projects, and their paths, data, people and plans.
  - type: input
    id: version
    attributes:
      label: HITLd version
      description: 'The plugin version or release tag, for example v0.1.0. `hitld --version` prints it.'
      placeholder: v0.1.0
    validations:
      required: false
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      description: 'The agent harness HITLd ran in. If it is not listed, pick Other and name it under what happened.'
      options:
        - Claude Code
        - GitHub Copilot
        - Other
    validations:
      required: false
  - type: input
    id: area
    attributes:
      label: Loop or area
      description: 'The loop, command or part of HITLd concerned.'
      placeholder: 'triage, the merge queue, hitld dispatch plan'
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: 'What happened'
      description: 'What prompted the idea, or the part of the design you are commenting on. Link the section if you can.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 'What you expected'
      description: 'What you would like HITLd to do, or what you would change in the design.'
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 'Evidence'
      description: 'Anything that supports it: examples, links, prior art.'
    validations:
      required: false
  - type: checkboxes
    id: confidential
    attributes:
      label: No confidential material
      options:
        - label: 'This issue holds no confidential material from any project or person.'
          required: true
